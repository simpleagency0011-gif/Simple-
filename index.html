    // ==========================================
    // 11. EXTRAS: FLOATING WHATSAPP & AI CHAT WIDGET
    // ==========================================
    function FloatingChatWidget() {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([
        { sender: "bot", text: "Hello! I am the SIMPLE AI Agent. Ask me about our websites, 24/7 AI agents, ad runs, or pricing packages!" }
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [messages]);

      const getSmartBotReply = (userMsg) => {
        const lower = userMsg.toLowerCase();
        if (["site", "website", "web", "page", "developer", "design"].some(k => lower.includes(k))) {
          return "We build modern, ultra-responsive websites tailored for your business that look stunning on every screen. Packages start at ₹6,999 (discounted from ₹9,999) and include a FREE Ad Run setup!";
        }
        if (["ai", "agent", "bot", "whatsapp", "instagram", "chat"].some(k => lower.includes(k))) {
          return "Our AI Agents operate 24/7 on WhatsApp or Instagram to instantly answer customer questions, share product catalogs, and capture leads while you sleep. Single platform is ₹3,999, or both platforms for ₹4,999 (discounted rate)!";
        }
        if (["ad", "ads", "run", "meta", "campaign", "marketing", "google", "youtube"].some(k => lower.includes(k))) {
          return "We run and optimize your ads across Instagram, Facebook, YouTube, and X for ₹1,599/mo (1 platform) or ₹2,699/mo (2 platforms). Note: We manage, target, and optimize the campaigns; clients provide their creative graphics/videos.";
        }
        if (["price", "cost", "pricing", "plan", "package", "rate", "inr", "rupee", "discount"].some(k => lower.includes(k))) {
          return "Here are our active limited-period discounted packages:\n1. Website + AI Agent + Free Ad Run: ₹11,999 (was ₹14,999)\n2. Website + Free Ad Run: ₹6,999 (was ₹9,999)\n3. AI Agent + Free Ad Run: ₹3,999 (was ₹5,999)\n4. Ad Run Only: ₹1,599/mo (was ₹2,499/mo).";
        }
        if (["contact", "phone", "email", "call", "reach", "hire", "number", "talk"].some(k => lower.includes(k))) {
          return "You can reach us directly:\n• Email: simple.agency0011@gmail.com\n• Instagram: @simple____agency\n• Or submit an inquiry through our Contact section on this page!";
        }
        return "I'm the SIMPLE AI Assistant! I can help you with our Website Development, 24/7 AI Agents, Ad Run Services, and Pricing packages. How can I help your business today?";
      };

      const handleSend = async (textToSend) => {
        const msg = textToSend || input;
        if (!msg.trim()) return;

        const newMessages = [...messages, { sender: "user", text: msg }];
        setMessages(newMessages);
        setInput("");
        setLoading(true);

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
          });
          if (res.ok) {
            const data = await res.json();
            setMessages([...newMessages, { sender: "bot", text: data.reply || getSmartBotReply(msg) }]);
          } else {
            setMessages([...newMessages, { sender: "bot", text: getSmartBotReply(msg) }]);
          }
        } catch (e) {
          setMessages([...newMessages, { sender: "bot", text: getSmartBotReply(msg) }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <>
          {/* Floating Action Trigger Container */}
          <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3">
            {/* SIMPLE AI Agent Trigger Button */}
            <button 
              onClick={() => setIsOpen(!isOpen)}
              className="bg-zinc-900 border border-white/20 hover:border-white text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 hover:bg-zinc-800 transition-all group"
              aria-label="Open SIMPLE AI Agent"
            >
              <div className="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></div>
              <span className="text-xs font-bold tracking-wider uppercase">SIMPLE AI</span>
              <Icon name="sparkles" size={15} className="text-white group-hover:rotate-12 transition-transform" />
            </button>
          </div>

          {/* AI Chat Modal Dialog */}
          {isOpen && (
            <div className="fixed bottom-24 right-6 z-50 w-[92vw] sm:w-[380px] max-w-sm rounded-3xl border border-white/20 bg-zinc-950 shadow-2xl overflow-hidden flex flex-col h-[500px] backdrop-blur-2xl animate-in fade-in slide-in-from-bottom-5">
              
              {/* Chat Header */}
              <div className="p-4 border-b border-white/10 bg-black flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full bg-white text-black font-black text-xs flex items-center justify-center">
                    S
                  </div>
                  <div>
                    <div className="text-xs font-bold text-white flex items-center gap-1.5">
                      <span>SIMPLE AI Assistant</span>
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    </div>
                    <div className="text-[10px] text-zinc-400">Instant Answers & Support</div>
                  </div>
                </div>
                <button 
                  onClick={() => setIsOpen(false)}
                  className="text-zinc-400 hover:text-white p-1"
                >
                  <Icon name="x" size={18} />
                </button>
              </div>

              {/* Chat Messages */}
              <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs bg-black/60">
                {messages.map((m, i) => (
                  <div 
                    key={i}
                    className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div 
                      className={`max-w-[85%] p-3 rounded-2xl whitespace-pre-line leading-relaxed ${
                        m.sender === 'user' 
                          ? 'bg-white text-black font-medium' 
                          : 'bg-zinc-900 border border-white/10 text-zinc-200'
                      }`}
                    >
                      {m.text}
                    </div>
                  </div>
                ))}
                {loading && (
                  <div className="flex justify-start">
                    <div className="bg-zinc-900 border border-white/10 p-3 rounded-2xl text-zinc-400 italic">
                      SIMPLE AI is typing...
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              {/* Quick Prompt Chips */}
              <div className="px-3 py-2 bg-black/90 border-t border-white/10 flex gap-2 overflow-x-auto text-[11px] whitespace-nowrap">
                <button 
                  onClick={() => handleSend("Tell me about Website plans")}
                  className="px-2.5 py-1 rounded-full bg-zinc-900 border border-white/15 text-zinc-300 hover:text-white hover:border-white transition-all shrink-0"
                >
                  Websites
                </button>
                <button 
                  onClick={() => handleSend("How does the AI Agent work?")}
                  className="px-2.5 py-1 rounded-full bg-zinc-900 border border-white/15 text-zinc-300 hover:text-white hover:border-white transition-all shrink-0"
                >
                  AI Agents
                </button>
                <button 
                  onClick={() => handleSend("What are the pricing plans?")}
                  className="px-2.5 py-1 rounded-full bg-zinc-900 border border-white/15 text-zinc-300 hover:text-white hover:border-white transition-all shrink-0"
                >
                  Pricing
                </button>
              </div>

              {/* Chat Input & WhatsApp Handoff */}
              <div className="p-3 bg-black border-t border-white/10 flex items-center gap-2">
                <input 
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}
                  onKeyDown={(e) => e.key === 'Enter' && handleSend()}
                  placeholder="Ask a question..."
                  className="flex-1 bg-zinc-900 border border-white/15 rounded-xl px-3 py-2 text-xs text-white placeholder-zinc-500 focus:outline-none focus:border-white"
                />
                <button 
                  onClick={() => handleSend()}
                  className="bg-white text-black p-2 rounded-xl hover:bg-zinc-200 transition-colors shrink-0"
                  aria-label="Send Message"
                >
                  <Icon name="send" size={14} />
                </button>
              </div>

              {/* Direct human handoff button */}
              <a 
                href="#contact"
                onClick={() => setIsOpen(false)}
                className="bg-zinc-950 border-t border-white/10 py-2.5 text-center text-[11px] font-semibold text-zinc-300 hover:text-white flex items-center justify-center gap-1.5 transition-colors"
              >
                <Icon name="mail" size={13} />
                <span>Submit Inquiry via Contact Form</span>
              </a>
            </div>
          )}
        </>
      );
    }
