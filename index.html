    function Contact({ selectedPlan, onResetPlan }) {
      const [formData, setFormData] = useState({
        name: "",
        phone: "",
        service: "Website + AI Agent + Free Ad Run",
        platformOption: "Single Platform (WhatsApp or Instagram)",
        message: "",
        hp_trap: "", // Honeypot trap field (hidden from humans)
        verified: false // Anti-spam verification check
      });
      const [submitted, setSubmitted] = useState(false);
      const [loading, setLoading] = useState(false);
      const [spamError, setSpamError] = useState("");
      const renderTimestamp = useRef(Date.now());

      // Sync form with selectedPlan when passed from pricing cards
      useEffect(() => {
        if (selectedPlan && selectedPlan.name) {
          setFormData((prev) => ({
            ...prev,
            service: selectedPlan.name,
            platformOption: selectedPlan.platform || prev.platformOption
          }));
        }
      }, [selectedPlan]);

      const handleSubmit = async (e) => {
        e.preventDefault();
        setSpamError("");

        // Spam Check 1: Honeypot trap filled by bot
        if (formData.hp_trap && formData.hp_trap.trim() !== "") {
          console.warn("Spam detected via honeypot trap.");
          setSubmitted(true);
          return;
        }

        // Spam Check 2: Submission too fast (< 2 seconds is bot behavior)
        const elapsedSeconds = (Date.now() - renderTimestamp.current) / 1000;
        if (elapsedSeconds < 2.0) {
          setSpamError("Please review your submission carefully before sending.");
          return;
        }

        // Spam Check 3: Human verification checkbox
        if (!formData.verified) {
          setSpamError("Please check the verification box to confirm you are human.");
          return;
        }

        setLoading(true);

        try {
          const res = await fetch("/api/contact", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              name: formData.name,
              phone: formData.phone,
              service: formData.service,
              platformOption: formData.platformOption,
              message: formData.message,
              submitted_at: new Date().toISOString()
            })
          });
          if (res.ok) {
            try { await res.json(); } catch (_) {}
          }
          setSubmitted(true);
        } catch (err) {
          // Fallback for static hosting
          setSubmitted(true);
        } finally {
          setLoading(false);
        }
      };

      return (
        <section id="contact" className="py-24 sm:py-32 bg-black relative border-t border-white/10">

    function CookieBanner() {
      const [visible, setVisible] = useState(false);

    function FloatingChatWidget() {
      const [isOpen, setIsOpen] = useState(false);
      const [messages, setMessages] = useState([
        { sender: "bot", text: "Hello! I am the SIMPLE Assistant. Ask me about our websites, 24/7 AI chat agents, ad management, or package pricing!" }
      ]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const chatEndRef = useRef(null);

      useEffect(() => {
        if (chatEndRef.current) {
          chatEndRef.current.scrollIntoView({ behavior: "smooth" });
        }
      }, [messages]);

      const getSmartBotReply = (userMsg) => {
        const lower = userMsg.toLowerCase();
        if (["time", "long", "duration", "day", "days", "turnaround", "delivery"].some(k => lower.includes(k))) {
          return "Our websites typically take 5–7 business days to build and launch from the date we receive your content and requirements. AI Agents take about 3–5 business days, and Ad campaigns are configured within 48–72 hours.";
        }
        if (["edit", "change", "update", "myself", "own", "ownership"].some(k => lower.includes(k))) {
          return "Yes! You own 100% of your website source code. The layout is built cleanly with modern HTML, CSS, and modular components so you or any developer can easily edit and update it yourself at any time.";
        }
        if (["seo", "search", "google", "rank", "ranking"].some(k => lower.includes(k))) {
          return "Yes, every website includes SEO foundations: semantic HTML5 tags, mobile optimization, fast asset loading, unique meta titles/descriptions, Open Graph social tags, and a sitemap.xml ready for Google Search Console indexing.";
        }
        if (["refund", "cancel", "cancellation", "policy"].some(k => lower.includes(k))) {
          return "For one-time website and AI agent builds, deposits cover dedicated development hours and are non-refundable once work begins. For monthly Ad Run retainers, you can pause or cancel at any time with 7 days' notice prior to your next cycle.";
        }
        if (["site", "website", "web", "page", "developer", "design"].some(k => lower.includes(k))) {
          return "Our Website package is a one-time fee of ₹6,999 (or ₹11,999 bundled with an AI Agent). It includes up to 6 responsive pages, contact forms, and 30 days of complimentary ad campaign setup on 1 platform. You own 100% of your website code with zero lock-in.";
        }
        if (["ai", "agent", "bot", "whatsapp", "instagram", "chat"].some(k => lower.includes(k))) {
          return "Our AI Agents operate 24/7 to answer customer FAQs, share product details, and capture leads on WhatsApp or Instagram. Setup is ₹3,999 (single platform) or ₹4,999 for both WhatsApp + Instagram synchronized.";
        }
        if (["ad", "ads", "run", "meta", "campaign", "marketing", "google", "spend", "budget"].some(k => lower.includes(k))) {
          return "Ad Run management is ₹1,599/mo for 1 platform or ₹2,699/mo for 2 platforms. Important: ad spend is funded directly by you to Meta or Google; we manage, target, and optimize the campaigns.";
        }
        if (["price", "cost", "pricing", "plan", "package", "rate", "inr", "rupee"].some(k => lower.includes(k))) {
          return "Here are our transparent rates:\n1. Website + AI Agent + Free Ad Run: ₹11,999 (Both AI: ₹12,999) [One-time]\n2. Website + Free Ad Run: ₹6,999 [One-time]\n3. AI Agent + Free Ad Run: ₹3,999 (Both: ₹4,999) [One-time]\n4. Ad Run Only: ₹1,599/mo (1 platform) or ₹2,699/mo (2 platforms) [Monthly].";
        }
        if (["contact", "phone", "email", "call", "reach", "hire", "number", "talk"].some(k => lower.includes(k))) {
          return "You can reach us directly:\n• Email: simple.agency0011@gmail.com\n• Instagram: @simple____agency\n• Or submit an inquiry through our Contact form on this page!";
        }
        return "I'm the SIMPLE Assistant! How can I help you regarding our web development, AI automation, or ad management services?";
      };

      const handleSend = async (textToSend) => {
        const msg = textToSend || input;
        if (!msg.trim()) return;

        const newMessages = [...messages, { sender: "user", text: msg }];
        setMessages(newMessages);
        setInput("");
        setLoading(true);

        try {
          const res = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg })
          });
          if (res.ok) {
            const data = await res.json();
            setMessages([...newMessages, { sender: "bot", text: data.reply || getSmartBotReply(msg) }]);
          } else {
            setMessages([...newMessages, { sender: "bot", text: getSmartBotReply(msg) }]);
          }
        } catch (e) {
          setMessages([...newMessages, { sender: "bot", text: getSmartBotReply(msg) }]);
        } finally {
          setLoading(false);
        }
      };

      return (
        <>
          <div className="fixed bottom-6 right-6 z-50 flex items-center gap-3">
            <button 
              onClick={() => setIsOpen(!isOpen)}
              className="bg-zinc-900 border border-white/20 hover:border-white text-white px-5 py-3 rounded-full shadow-2xl flex items-center gap-2 hover:bg-zinc-800 transition-all group min-h-[48px]"
              aria-label="Open SIMPLE Assistant"

              <div className="w-2.5 h-2.5 rounded-full bg-emerald-400"></div>
              <span className="text-xs font-bold tracking-wider uppercase">SIMPLE AI</span>
              <Icon name="sparkles" size={15} className="text-white group-hover:rotate-12 transition-transform" />
            </button>
          </div>

          {isOpen && (
            <div className="fixed bottom-24 right-4 sm:right-6 z-50 w-[92vw] sm:w-[380px] max-w-sm rounded-3xl border border-white/20 bg-zinc-950 shadow-2xl overflow-hidden flex flex-col h-[500px] backdrop-blur-2xl animate-in fade-in slide-in-from-bottom-5">
              
              <div className="p-4 border-b border-white/10 bg-black flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-full bg-white text-black font-black text-xs flex items-center justify-center">
                    S
                  </div>
                  <div>
                    <div className="text-xs font-bold text-white flex items-center gap-1.5">
                      <span>SIMPLE Assistant</span>
                      <span className="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                    </div>
                    <div className="text-[10px] text-zinc-400">Transparent Answers & Support</div>
                  </div>
                </div>
                <button 
                  onClick={() => setIsOpen(false)}
                  className="text-zinc-400 hover:text-white p-1"
                  aria-label="Close Assistant"
                >
                  <Icon name="x" size={18} />
                </button>
              </div>

              <div className="flex-1 p-4 overflow-y-auto space-y-3 text-xs bg-black/60">
                {messages.map((m, i) => (
                  <div 
                    key={i}
                    className={`flex ${m.sender === 'user' ? 'justify-end' : 'justify-start'}`}
                  >
                    <div 
                      className={`max-w-[85%] p-3 rounded-2xl whitespace-pre-line leading-relaxed ${
                        m.sender === 'user' 
                          ? 'bg-white text-black font-medium' 
                          : 'bg-zinc-900 border border-white/10 text-zinc-200'
                      }`}
                    >
                      {m.text}
                    </div>
                  </div>
                ))}
                {loading && (
                  <div className="flex justify-start">
                    <div className="bg-zinc-900 border border-white/10 p-3 rounded-2xl text-zinc-400 italic">
                      SIMPLE Assistant is typing...
                    </div>
                  </div>
                )}
                <div ref={chatEndRef} />
              </div>

              <div className="px-3 py-2 bg-black/90 border-t border-white/10 flex gap-2 overflow-x-auto text-[11px] whitespace-nowrap">
                <button 
                  onClick={() => handleSend("How long does a website take?")}

                </button>
                <button

                >

                </button>
                <button 
                  onClick={() => handleSend("Do you do SEO?")}

                >
                  SEO
                </button>
                <button 
                  onClick={() => handleSend("What is the pricing list?")}

                >
                  Pricing
                </button>
              </div>

              <div className="p-3 bg-black border-t border-white/10 flex items-center gap-2">
                <input 
                  type="text"
                  value={input}
                  onChange={(e) => setInput(e.target.value)}

    // MAIN APP COMPONENT (With Dynamic Unique Titles)
    // ==========================================
    function App() {
      const [selectedPlan, setSelectedPlan] = useState(null);

      // Pre-Launch Check 2: Dynamic unique page titles per section
      useEffect(() => {
        const sectionTitles = {
          home: "Home | SIMPLE Agency",
          services: "Services | SIMPLE Agency",
          capabilities: "Sample Capabilities | SIMPLE Agency",
          pricing: "Pricing & Plans | SIMPLE Agency",
          boundaries: "Service Boundaries | SIMPLE Agency",
          faq: "Frequently Asked Questions | SIMPLE Agency",
          about: "About Us | SIMPLE Agency",
          contact: "Contact & Inquiries | SIMPLE Agency"
        };

        const handleScroll = () => {
          const sections = Object.keys(sectionTitles);
          let currentSection = "home";

          for (const s of sections) {
            const el = document.getElementById(s);
            if (el) {
              const rect = el.getBoundingClientRect();
              if (rect.top <= 200 && rect.bottom >= 200) {
                currentSection = s;
                break;
              }
            }
          }

          if (sectionTitles[currentSection] && document.title !== sectionTitles[currentSection]) {
            document.title = sectionTitles[currentSection];
          }
        };

        window.addEventListener("scroll", handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      const handleSelectPlan = (planInfo) => {
        setSelectedPlan(planInfo);
        const contactElem = document.getElementById("contact");
        if (contactElem) {
          contactElem.scrollIntoView({ behavior: "smooth" });
        }
      };

      const handleResetPlan = () => {
        setSelectedPlan(null);
      };

      return (
        <div className="min-h-screen bg-black text-white selection:bg-white selection:text-black">
          <Navbar />
          <main>
            <Hero />
            <Services />
            <Capabilities />
            <Pricing onSelectPlan={handleSelectPlan} />
            <ServiceBoundaries />
            <HowItWorks />
            <FAQSection />
            <AboutAgency />
            <Contact selectedPlan={selectedPlan} onResetPlan={handleResetPlan} />
          </main>
          <Footer />
          <CookieBanner />
          <FloatingChatWidget />
        </div>
      );
    }

    // Render React App
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
